<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="美股風控計算">
  <title>美股倉位與風險計算機</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 1.25rem; color: var(--accent); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-dim); font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .card-title { font-size: 0.95rem; font-weight: bold; color: var(--accent); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #0b1120; color: #fff; font-size: 1rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    .badge-group { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; padding-bottom: 2px; }
    .badge { padding: 4px 10px; border-radius: 6px; background: #0f172a; border: 1px solid var(--border); font-size: 0.75rem; color: var(--text-dim); cursor: pointer; white-space: nowrap; }
    .badge.active { border-color: var(--accent); color: var(--accent); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .result-box { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
    .result-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; }
    .result-val { font-size: 1.15rem; font-weight: bold; }
    .val-green { color: var(--green); }
    .val-red { color: var(--red); }
    .val-accent { color: var(--accent); }
    .note { font-size: 0.75rem; color: var(--text-dim); line-height: 1.4; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>美股倉位與風險計算機</h1>
  </div>

  <div class="tabs">
    <div class="tab-btn active" onclick="switchTab('forward')">正推：算可買股數</div>
    <div class="tab-btn" onclick="switchTab('reverse')">反推：算止損價</div>
  </div>

  <!-- 正推計算模式 -->
  <div id="tab-forward">
    <div class="card">
      <div class="card-title">1. 基本參數</div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">股票代號</label>
          <input type="text" id="symbol" value="JPM">
        </div>
        <div class="form-group">
          <label class="form-label">現價 (USD)</label>
          <input type="number" step="0.001" id="price" value="357.620" oninput="calcForward()">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">倉位總額 ($)</label>
          <input type="number" id="capital" value="10000" oninput="calcForward()">
        </div>
        <div class="form-group">
          <label class="form-label">風險 % (預設1%)</label>
          <input type="number" step="0.1" id="riskPct" value="1.0" oninput="calcForward()">
          <div class="badge-group">
            <span class="badge" onclick="setRisk(0.5)">0.5%</span>
            <span class="badge active" onclick="setRisk(1)">1.0%</span>
            <span class="badge" onclick="setRisk(2)">2.0%</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">2. 止損設定</div>
      <div class="form-group">
        <label class="form-label">設定方式</label>
        <select id="stopMode" onchange="toggleStopMode()">
          <option value="price">依止損價格 ($)</option>
          <option value="pct">依止損百分比 (%)</option>
        </select>
      </div>
      <div class="form-group" id="group-stop-price">
        <label class="form-label">止損價 (USD)</label>
        <input type="number" step="0.001" id="stopPrice" value="350" oninput="calcForward()">
      </div>
      <div class="form-group" id="group-stop-pct" style="display:none;">
        <label class="form-label">止損跌幅 (%)</label>
        <input type="number" step="0.1" id="stopPctInput" value="5.0" oninput="calcForward()">
        <div class="badge-group">
          <span class="badge" onclick="setStopPct(3)">-3%</span>
          <span class="badge active" onclick="setStopPct(5)">-5%</span>
          <span class="badge" onclick="setStopPct(8)">-8%</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">3. 計算結果</div>
      <div class="grid-2" style="margin-bottom: 10px;">
        <div class="result-box">
          <div class="result-label">可買股數 (向下取整)</div>
          <div class="result-val val-green" id="res-shares">0 股</div>
        </div>
        <div class="result-box">
          <div class="result-label">實際最大虧損</div>
          <div class="result-val val-red" id="res-maxloss">$0.00</div>
        </div>
      </div>
      <div class="grid-2">
        <div class="result-box">
          <div class="result-label">買入所需金額</div>
          <div class="result-val val-accent" id="res-cost">$0.00</div>
        </div>
        <div class="result-box">
          <div class="result-label">止損跌幅 / 距離</div>
          <div class="result-val" id="res-stopdist">0.00%</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">4. 快速目標與情境 (+/- %)</div>
      <div class="grid-2">
        <div class="result-box">
          <div class="result-label">+5% 目標價</div>
          <div class="result-val val-green" id="res-target-plus5">$0.00</div>
        </div>
        <div class="result-box">
          <div class="result-label">-5% 價位</div>
          <div class="result-val val-red" id="res-target-minus5">$0.00</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 反推計算模式 -->
  <div id="tab-reverse" style="display:none;">
    <div class="card">
      <div class="card-title">1. 反推輸入參數</div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">現價 (USD)</label>
          <input type="number" step="0.001" id="rev-price" value="357.620" oninput="calcReverse()">
        </div>
        <div class="form-group">
          <label class="form-label">持有 / 擬買股數</label>
          <input type="number" id="rev-shares" value="13" oninput="calcReverse()">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">最大允許虧損總額 ($)</label>
        <input type="number" id="rev-loss" value="100" oninput="calcReverse()">
        <div class="badge-group">
          <span class="badge" onclick="setRevLoss(50)">$50</span>
          <span class="badge active" onclick="setRevLoss(100)">$100</span>
          <span class="badge" onclick="setRevLoss(200)">$200</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">2. 反推止損設定結果</div>
      <div class="grid-2" style="margin-bottom: 10px;">
        <div class="result-box">
          <div class="result-label">應設止損價</div>
          <div class="result-val val-red" id="rev-res-price">$0.00</div>
        </div>
        <div class="result-box">
          <div class="result-label">止損百分比</div>
          <div class="result-val val-red" id="rev-res-pct">0.00%</div>
        </div>
      </div>
      <div class="grid-2">
        <div class="result-box">
          <div class="result-label">每股可承受風險</div>
          <div class="result-val val-accent" id="rev-res-per-share">$0.00</div>
        </div>
        <div class="result-box">
          <div class="result-label">總投入金額</div>
          <div class="result-val" id="rev-res-cost">$0.00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b, idx) => {
        b.classList.toggle('active', (tab === 'forward' && idx === 0) || (tab === 'reverse' && idx === 1));
      });
      document.getElementById('tab-forward').style.display = tab === 'forward' ? 'block' : 'none';
      document.getElementById('tab-reverse').style.display = tab === 'reverse' ? 'block' : 'none';
      if (tab === 'reverse') {
        document.getElementById('rev-price').value = document.getElementById('price').value;
        const forwardShares = parseInt(document.getElementById('res-shares').innerText) || 13;
        document.getElementById('rev-shares').value = forwardShares;
        calcReverse();
      }
    }

    function toggleStopMode() {
      const mode = document.getElementById('stopMode').value;
      document.getElementById('group-stop-price').style.display = mode === 'price' ? 'block' : 'none';
      document.getElementById('group-stop-pct').style.display = mode === 'pct' ? 'block' : 'none';
      calcForward();
    }

    function setRisk(val) {
      document.getElementById('riskPct').value = val;
      calcForward();
    }

    function setStopPct(val) {
      document.getElementById('stopPctInput').value = val;
      calcForward();
    }

    function setRevLoss(val) {
      document.getElementById('rev-loss').value = val;
      calcReverse();
    }

    function calcForward() {
      const price = parseFloat(document.getElementById('price').value) || 0;
      const capital = parseFloat(document.getElementById('capital').value) || 0;
      const riskPct = (parseFloat(document.getElementById('riskPct').value) || 0) / 100;
      const mode = document.getElementById('stopMode').value;

      let stopPrice = 0;
      if (mode === 'price') {
        stopPrice = parseFloat(document.getElementById('stopPrice').value) || 0;
      } else {
        const stopPct = (parseFloat(document.getElementById('stopPctInput').value) || 0) / 100;
        stopPrice = price * (1 - stopPct);
      }

      const riskPerShare = Math.max(0, price - stopPrice);
      const maxRiskDollar = capital * riskPct;
      
      let shares = 0;
      if (riskPerShare > 0) {
        shares = Math.floor(maxRiskDollar / riskPerShare);
      }

      const cost = shares * price;
      const actualLoss = shares * riskPerShare;
      const stopDistPct = price > 0 ? ((price - stopPrice) / price) * 100 : 0;

      document.getElementById('res-shares').innerText = shares.toLocaleString() + ' 股';
      document.getElementById('res-maxloss').innerText = '$' + actualLoss.toFixed(2);
      document.getElementById('res-cost').innerText = '$' + cost.toFixed(2);
      document.getElementById('res-stopdist').innerText = stopDistPct.toFixed(2) + '% ($' + riskPerShare.toFixed(2) + ')';

      document.getElementById('res-target-plus5').innerText = '$' + (price * 1.05).toFixed(2);
      document.getElementById('res-target-minus5').innerText = '$' + (price * 0.95).toFixed(2);
    }

    function calcReverse() {
      const price = parseFloat(document.getElementById('rev-price').value) || 0;
      const shares = parseFloat(document.getElementById('rev-shares').value) || 0;
      const maxLoss = parseFloat(document.getElementById('rev-loss').value) || 0;

      if (shares > 0 && price > 0) {
        const riskPerShare = maxLoss / shares;
        const stopPrice = Math.max(0, price - riskPerShare);
        const stopPct = (riskPerShare / price) * 100;
        const totalCost = shares * price;

        document.getElementById('rev-res-price').innerText = '$' + stopPrice.toFixed(3);
        document.getElementById('rev-res-pct').innerText = '-' + stopPct.toFixed(2) + '%';
        document.getElementById('rev-res-per-share').innerText = '$' + riskPerShare.toFixed(3);
        document.getElementById('rev-res-cost').innerText = '$' + totalCost.toFixed(2);
      }
    }

    calcForward();
  </script>
</body>
</html>
